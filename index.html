<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#120809;--bg2:#1d0c0e;--bg3:#2a1416;--line:#5a3b1c;--gold:#c9a24a;--gold2:#e2c26f;--red:#7a1018;--red2:#9e1b22;--ink:#f1e6cc;--mute:#c9b48a;--ok:#8fd27a;--okbg:#21401d;--bad:#f08a80;--badbg:#4d1316;--blue:#2a5ca8;--cap:'Cinzel',Georgia,serif;--txt:'EB Garamond',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--txt);font-size:17px;line-height:1.4;overscroll-behavior:none}
body{min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select{font:inherit}
.cap{font-family:var(--cap);letter-spacing:.12em}
.mute{color:var(--mute)}
.wrap{max-width:520px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 0 8px;gap:10px}
.brand{font-family:var(--cap);font-weight:900;font-size:22px;letter-spacing:.28em;color:var(--gold)}
.rank{font-family:var(--cap);font-size:11px;letter-spacing:.14em;color:var(--mute)}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;background:none}
.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg2)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.lbl{font-family:var(--cap);font-size:11px;letter-spacing:.14em;color:var(--mute)}
.big{font-family:var(--cap);font-weight:700;font-size:22px}
.btn{display:block;width:100%;min-height:56px;border-radius:8px;border:2px solid var(--gold);background:var(--red);color:#f7ecd0;font-family:var(--cap);font-weight:900;font-size:18px;letter-spacing:.16em;padding:8px 12px}
.btn:active{transform:translateY(1px);background:var(--red2)}
.btn2{display:block;width:100%;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-family:var(--cap);font-weight:700;font-size:14px;letter-spacing:.12em;padding:8px 12px}
.btn2:active{background:var(--bg3)}
.sec{margin-top:16px}
h2{font-family:var(--cap);font-size:13px;letter-spacing:.2em;color:var(--gold);margin:22px 0 8px;font-weight:700}
.quote{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 4px;margin-top:16px}
.quote i{font-size:19px}
.bubble{display:flex;gap:12px;align-items:flex-start;margin-top:16px}
.bubble .say{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px}
.who{font-family:var(--cap);font-size:11px;letter-spacing:.14em;color:var(--gold)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0b0405;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{background:none;border:none;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--cap);font-size:10px;letter-spacing:.1em;color:var(--mute)}
nav.tabs button.on{color:var(--gold2)}
nav.tabs svg{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:8px 14px;min-height:40px;font-size:15px}
.chip.on{border-color:var(--gold);background:var(--red);color:#fff4dc}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:12px 14px;margin-top:8px;min-height:64px}
.mode:active{background:var(--bg3)}
.mode .t{font-family:var(--cap);font-weight:700;font-size:15px;letter-spacing:.08em}
.mode .d{font-size:14px;color:var(--mute)}
.mode .ic{width:40px;height:40px;flex:none;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
/* quiz */
.qz{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:flex;flex-direction:column}
.qz .in{max-width:520px;width:100%;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100%}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--mute);display:flex;align-items:center;justify-content:center}
.qcard{margin-top:14px;padding:18px 14px;border:2px solid var(--gold);border-radius:8px;background:var(--bg2);text-align:center;position:relative}
.qcard .ask{font-family:var(--cap);font-size:11px;letter-spacing:.2em;color:var(--mute)}
.qcard .w{font-family:var(--cap);font-weight:700;font-size:30px;margin:6px 0 2px;word-break:break-word}
.qcard .w.fi{font-family:var(--txt);font-weight:600;font-size:26px}
.qcard .s{color:var(--mute);font-size:16px}
.spk{position:absolute;top:8px;right:8px;width:40px;height:40px;border:none;background:none;color:var(--gold)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:64px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;font-size:18px;padding:8px 10px;line-height:1.2}
.opt.lat{font-family:var(--cap);font-weight:700;font-size:16px}
.opt.ok{background:var(--okbg);border:2px solid var(--ok)}
.opt.no{background:var(--badbg);border:2px solid var(--bad)}
.opt:disabled{cursor:default}
.fb{min-height:66px;margin-top:12px;text-align:center}
.fb .v{font-family:var(--cap);font-weight:700;letter-spacing:.14em;font-size:16px}
.fb .v.g{color:var(--ok)}.fb .v.b{color:var(--bad)}
.fb .e{font-size:15px;color:var(--mute);margin-top:2px}
.foe{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px}
.foe svg{transition:transform .15s}
.foe.hit svg{animation:hit .35s}
@keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-4deg)}50%{transform:translateX(8px)}100%{transform:translateX(0)}}
.hp{width:220px;height:10px;background:var(--bg3);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.hp>i{display:block;height:100%;background:var(--red2);transition:width .3s}
.shield{display:flex;gap:6px}
.shield i{width:22px;height:10px;border-radius:2px;background:var(--gold)}
.shield i.off{background:var(--bg3);border:1px solid var(--line)}
.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}
.flash.g{background:radial-gradient(circle,rgba(226,194,111,.35),transparent 70%);animation:fl .5s}
.flash.r{background:radial-gradient(circle,rgba(240,80,70,.3),transparent 70%);animation:fl .5s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.timer{height:4px;background:var(--bg3);margin-top:8px;border-radius:2px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--gold);transform-origin:left}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .p{width:100%;max-width:520px;background:var(--bg2);border-top:2px solid var(--gold);border-radius:14px 14px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field input,.field textarea,.field select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:17px;width:100%}
textarea{font-family:ui-monospace,monospace!important;font-size:12px!important;min-height:90px}
.tin{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:14px;font-size:20px;margin-top:16px}
.tin:focus{outline:none;border-color:var(--gold)}
.lex{display:grid;grid-template-columns:12px 1fr;gap:4px 10px;align-items:baseline;font-size:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);display:inline-block}
.dot.m{background:var(--red2);border-color:var(--gold)}.dot.s{background:var(--blue)}.dot.w{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--gold);border-radius:8px;padding:10px 16px;z-index:70;font-size:15px;max-width:90vw;text-align:center}
.candle .fl{transform-origin:8px 9px;animation:flk 1.6s infinite ease-in-out}
@keyframes flk{0%,100%{transform:scale(1)}50%{transform:scale(.88,1.08)}}
.arms{display:flex;gap:18px;justify-content:center;align-items:flex-end}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick button{min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;position:relative}
.pick button.on{border:2px solid var(--gold2)}
.pick button:disabled{opacity:.35}
.lock{position:absolute;right:4px;top:3px;font-size:10px;color:var(--mute)}
.intro{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;background:var(--bg2)}
.intro .l{font-family:var(--cap);font-weight:700}
a{color:var(--gold2)}
@media (prefers-reduced-motion:reduce){.wrap *,.qz *{animation:none!important;transition:none!important}}
#intro{position:fixed;inset:0;z-index:100;background:#050203;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .9s ease,transform .9s ease}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
#intro .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(120,20,26,.35) 0%,rgba(5,2,3,0) 55%),radial-gradient(ellipse at center,transparent 40%,#000 100%);opacity:0;animation:iFade 3s 1.2s forwards}
#intro .rays{position:absolute;left:50%;top:-30%;width:180vmax;height:180vmax;transform:translateX(-50%);background:repeating-conic-gradient(from 160deg at 50% 0%,rgba(255,226,150,.0) 0deg,rgba(255,226,150,.07) 3deg,rgba(255,226,150,0) 7deg,rgba(255,226,150,0) 13deg);-webkit-mask:radial-gradient(circle at 50% 0%,#000 10%,transparent 60%);mask:radial-gradient(circle at 50% 0%,#000 10%,transparent 60%);opacity:0;animation:iFade 4s 1.6s forwards,iSway 14s 1.6s ease-in-out infinite alternate}
#intro .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 20px;text-align:center}
#intro svg.arch{width:min(74vw,320px);height:auto;overflow:visible}
#intro .ln{fill:none;stroke:#c9a24a;stroke-width:2.2;stroke-dasharray:1400;stroke-dashoffset:1400;animation:iDraw 2.4s 1.4s cubic-bezier(.6,0,.3,1) forwards}
#intro .ln.t{stroke-width:1.2;opacity:.7;animation-delay:2.1s}
#intro .pet{opacity:0;transform-box:fill-box;transform-origin:center;animation:iPet .7s forwards;filter:drop-shadow(0 0 6px currentColor)}
#intro .core{opacity:0;animation:iFade 1s 3.5s forwards}
#intro .glow{opacity:0;animation:iGlow 3s 3.4s ease-in-out forwards}
#intro .ttl{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:clamp(40px,12vw,64px);letter-spacing:.32em;margin-right:-.32em;color:#e2c26f;text-shadow:0 0 24px rgba(226,194,111,.45),0 2px 0 #5a3b1c;opacity:0;filter:blur(10px);animation:iTitle 1.6s 3.9s forwards}
#intro .sub{font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;color:#e8dcc0;opacity:0;animation:iFade 1.2s 4.7s forwards}
#intro .rub{font-family:Cinzel,Georgia,serif;font-size:11px;letter-spacing:.3em;color:#c9b48a;opacity:0;animation:iFade 1.2s 5.1s forwards}
#intro .go{margin-top:18px;min-height:56px;padding:0 18px;border:2px solid #c9a24a;border-radius:8px;background:#7a1018;color:#f7ecd0;font-family:Cinzel,Georgia,serif;font-weight:900;font-size:15px;letter-spacing:.14em;opacity:0;transform:translateY(8px);animation:iUp .9s 5.6s forwards,iPulse 2.4s 6.6s ease-in-out infinite;cursor:pointer}
#intro .go small{display:block;font-family:'EB Garamond',Georgia,serif;font-weight:400;font-style:italic;letter-spacing:0;font-size:14px;opacity:.85;text-transform:none}
#intro .cnd{position:absolute;bottom:5%;display:flex;flex-direction:column;align-items:center;opacity:0;animation:iFade 1.4s .9s forwards}
#intro .cnd.l{left:4%}#intro .cnd.r{right:4%}
#intro .cnd i{width:12px;height:22px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff6c8 0%,#f2b33d 45%,rgba(242,120,40,.0) 75%);box-shadow:0 0 30px 10px rgba(242,179,61,.35);animation:iFlick 1.3s infinite ease-in-out;transform-origin:50% 100%}
#intro .cnd b{display:block;width:14px;height:clamp(50px,11vh,100px);margin-top:2px;background:linear-gradient(90deg,#d8ccad,#f3ead4 45%,#c9bc98);border-radius:2px}
#intro .cnd u{display:block;width:34px;height:8px;background:#c9a24a;border-radius:2px;text-decoration:none}
#intro .dust{position:absolute;width:3px;height:3px;border-radius:50%;background:#f3dc9c;opacity:0;animation:iDust linear infinite}
#intro .door{position:absolute;top:0;bottom:0;width:50.5%;z-index:3;background:repeating-linear-gradient(90deg,#2b1609 0 46px,#21100606 46px 48px,#331c0c 48px 94px),#2b1609;box-shadow:inset 0 0 80px rgba(0,0,0,.7);animation-duration:2.3s;animation-delay:.5s;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.5,0,.25,1)}
#intro .door:before{content:"";position:absolute;inset:6% 9%;border:3px solid #6b4a1e;border-radius:6px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.25)}
#intro .door:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#8a6a2a 3px,transparent 4px) 0 0/48px 64px;opacity:.55}
#intro .door.l{left:0;transform-origin:left center;animation-name:iDoorL;border-right:3px solid #120a04}
#intro .door.r{right:0;transform-origin:right center;animation-name:iDoorR;border-left:3px solid #120a04}
#intro .door .x{position:absolute;top:50%;width:23px;height:160px;transform:translateY(-50%);z-index:2}
#intro .door.l .x{right:-2px}#intro .door.r .x{left:-2px}
#intro .door .x:before{content:"";position:absolute;top:0;bottom:0;width:8px;background:linear-gradient(90deg,#b08a3a,#e2c26f,#b08a3a)}
#intro .door .x:after{content:"";position:absolute;top:44px;height:16px;width:23px;background:linear-gradient(#b08a3a,#e2c26f,#b08a3a)}
#intro .door.l .x:before{right:0}#intro .door.r .x:before{left:0}
#intro .skip{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-family:Cinzel,serif;font-size:10px;letter-spacing:.3em;color:rgba(201,180,138,.5);z-index:4;animation:iFade 1s 1s backwards,iHide .6s 5.4s forwards}
@keyframes iHide{to{opacity:0}}
#intro.done *{animation-delay:0s!important;animation-duration:.01s!important}
#intro.done .door{display:none}
#intro.done .go{animation:iPulse 2.4s ease-in-out infinite!important;opacity:1;transform:none}
#intro.done .skip{display:none}
@keyframes iFade{to{opacity:1}}
@keyframes iSway{from{transform:translateX(-50%) rotate(-4deg)}to{transform:translateX(-50%) rotate(4deg)}}
@keyframes iDraw{to{stroke-dashoffset:0}}
@keyframes iPet{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes iGlow{0%{opacity:0}40%{opacity:.9}100%{opacity:.45}}
@keyframes iTitle{to{opacity:1;filter:blur(0);letter-spacing:.22em;margin-right:-.22em}}
@keyframes iUp{to{opacity:1;transform:none}}
@keyframes iPulse{0%,100%{box-shadow:0 0 0 0 rgba(226,194,111,.0)}50%{box-shadow:0 0 22px 2px rgba(226,194,111,.45)}}
@keyframes iFlick{0%,100%{transform:scale(1) rotate(-1deg)}30%{transform:scale(.92,1.08) rotate(2deg)}60%{transform:scale(1.04,.95) rotate(-2deg)}}
@keyframes iDust{0%{opacity:0;transform:translate(0,0)}15%{opacity:.8}100%{opacity:0;transform:translate(var(--dx),-60vh)}}
@keyframes iDoorL{to{transform:perspective(900px) rotateY(-105deg)}}
@keyframes iDoorR{to{transform:perspective(900px) rotateY(105deg)}}
@media (prefers-reduced-motion:reduce){#intro *{animation-delay:0s!important;animation-duration:.01s!important}#intro .door{display:none}}

</style>
</head>

function bell(f,vol,dur){const a=ac();if(!a||!S.snd)return;const t=a.currentTime;const g=a.createGain();g.connect(a.destination);g.gain.value=vol||.18;[[.5,.5],[1,1],[1.19,.55],[1.5,.35],[2,.4],[2.51,.2],[3.01,.12]].forEach(([r,am])=>{const o=a.createOscillator();const og=a.createGain();o.frequency.value=f*r;o.type='sine';og.gain.setValueAtTime(am,t);og.gain.exponentialRampToValueAtTime(.0001,t+(dur||2.2)/(r>1?r*.7:1));o.connect(og);og.connect(g);o.start(t);o.stop(t+(dur||2.2)+.1)})}
function noise(dur,freq,q,vol,type){const a=ac();if(!a||!S.snd)return;const t=a.currentTime;const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q||1;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}
function thud(){const a=ac();if(!a||!S.snd)return;const t=a.currentTime;const o=a.createOscillator();const g=a.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.25);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.32);noise(.18,400,.7,.35,'lowpass')}

function pickWords(pool,n,maxNew){
 maxNew=maxNew==null?6:maxNew;const t=TD();const out=new Set();
 const wounded=shuf(pool.filter(i=>S.w[i]&&(S.w[i].wr||S.w[i].gw)));
 const due=pool.filter(i=>seen(i)&&S.w[i].due<=t).sort((a,b)=>S.w[a].due-S.w[b].due);
 const fresh=pool.filter(i=>!seen(i));
 wounded.slice(0,Math.ceil(n/3)).forEach(i=>out.add(i));
 for(const i of due){if(out.size>=n)break;out.add(i)}
 let k=0;for(const i of fresh){if(out.size>=n||k>=maxNew)break;out.add(i);k++}
 const rest=shuf(pool.filter(i=>seen(i)&&!mastered(i)));for(const i of rest){if(out.size>=n)break;out.add(i)}
 const any=shuf(pool.filter(seen));for(const i of any){if(out.size>=n)break;out.add(i)}
 for(const i of fresh){if(out.size>=Math.min(n,8))break;out.add(i)}
 return shuf([...out]);
}

function normFi(s){return strip(s).replace(/[’'"!?.;:]/g,'').replace(/\s+/g,' ').trim()}
function accepts(f){const out=new Set();f.split(/[,;]/).forEach(p=>{if(/ t\. /.test(p)){const [a,b]=p.split(/ t\. /);const tail=b.split(' ').slice(1).join(' ');[b,a+(tail?' '+tail:'')].forEach(x=>out.add(normFi(x)))}p=p.replace(/\bt\.\s*/g,'').trim();if(!p)return;const noPar=p.replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();const withPar=p.replace(/[()]/g,'').trim();[noPar,withPar,p.replace(/\(([^)]*)\)/g,'$1')].forEach(x=>{x=normFi(x);if(x)out.add(x);const y=x.replace(/^(jonkun|jnk|jtak|olla)\s+/,'');if(y&&y!==x)out.add(y)})});return [...out]}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function checkTyped(ans,f){const a=normFi(ans);if(!a)return false;const acc=accepts(f);return acc.some(x=>x===a||(x.length>=5&&lev(x,a)<=1)||(a.length>=4&&x.split(' ').includes(a)))}

 if(ok){$('#tin').style.borderColor='var(--ok)';finishTyped(i,true,v)}else{$('#tin').style.borderColor='var(--bad)';$('#fb').innerHTML=`<div class="v b">${v.trim()?'EI TÄSMÄÄ':'TYHJÄ'}</div><div class="e">Oikein: <b style="color:var(--ink)">${esc(w.f)}</b></div><div class="row" style="margin-top:10px">${v.trim()?'<button class="btn2" data-a="tacc" data-v="1">Hyväksy silti</button>':''}<button class="btn2" data-a="tacc" data-v="0">Jatka</button></div>`;SND.bad()}}

async function exportCode(){const data=JSON.stringify(S);let code;try{if(window.CompressionStream){const cs=new Blob([data]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let b='';buf.forEach(x=>b+=String.fromCharCode(x));code='VG1z'+btoa(b)}else code='VG1j'+btoa(unescape(encodeURIComponent(data)))}catch(e){code='VG1j'+btoa(unescape(encodeURIComponent(data)))}
 sheet(`<div class="cap" style="color:var(--gold);font-weight:700">SIIRTOKOODI</div><p class="mute" style="font-size:15px">Kopioi koodi ja lähetä se itsellesi viestinä. Liitä se toisella laitteella kohtaan Ordo → Liitä koodi.</p><textarea id="cd" readonly style="width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px">${code}</textarea><div class="row" style="margin-top:10px"><button class="btn2" data-a="copy">Kopioi</button><button class="btn2" data-a="close">Valmis</button></div>`)}

 const n=11,cx=160,cy=168,R=56,cols=['#c1121f','#1f5fbf','#e2b33d','#c1121f','#2f8f4e','#1f5fbf','#c1121f','#e2b33d','#7d3c98','#1f5fbf','#c1121f'];
 let pet='';for(let k=0;k<n;k++){const a=k/n*Math.PI*2-Math.PI/2;const x=(cx+R*Math.cos(a)).toFixed(1),y=(cy+R*Math.sin(a)).toFixed(1);pet+=`<circle class="pet" cx="${x}" cy="${y}" r="17" fill="${cols[k]}" color="${cols[k]}" stroke="#e2c26f" stroke-width="1.5" style="animation-delay:${(2.9+k*.09).toFixed(2)}s"/>`;}
 let tr='';for(let k=0;k<n;k++){const a=k/n*Math.PI*2-Math.PI/2+Math.PI/n;tr+=`<path class="ln t" d="M${(cx+24*Math.cos(a)).toFixed(1)} ${(cy+24*Math.sin(a)).toFixed(1)}L${(cx+82*Math.cos(a)).toFixed(1)} ${(cy+82*Math.sin(a)).toFixed(1)}"/>`}
 let dust='';for(let k=0;k<26;k++)dust+=`<span class="dust" style="left:${rnd(100)}%;top:${55+rnd(45)}%;--dx:${rnd(60)-30}px;animation-duration:${7+rnd(8)}s;animation-delay:${(1.5+Math.random()*6).toFixed(1)}s"></span>`;
 return `<div class="vig"></div><div class="rays"></div>${dust}
 <div class="cnd l"><i></i><b></b><u></u></div><div class="cnd r"><i></i><b></b><u></u></div>
 <div class="stage">
  <svg class="arch" viewBox="0 0 320 380" aria-hidden="true">
   <defs><radialGradient id="ig" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd98a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient></defs>
   <circle class="glow" cx="${cx}" cy="${cy}" r="120" fill="url(#ig)"/>
   <path class="ln" d="M40 380V176C40 92 92 40 160 14 228 40 280 92 280 176V380"/>
   <path class="ln t" d="M58 380V180C58 104 104 60 160 36 216 60 262 104 262 180V380"/>
   <path class="ln" d="M160 14V-26M146 -12H174"/>
   <circle class="ln" cx="${cx}" cy="${cy}" r="86"/>
   ${tr}${pet}
   <g class="core"><circle cx="${cx}" cy="${cy}" r="22" fill="#120809" stroke="#e2c26f" stroke-width="2"/><rect x="${cx-3}" y="${cy-13}" width="6" height="26" fill="#e2c26f"/><rect x="${cx-10}" y="${cy-6}" width="20" height="6" fill="#e2c26f"/></g>
   <path class="ln t" d="M80 380V290M120 380V280M200 380V280M240 380V290M80 290Q100 262 120 280M200 280Q220 262 240 290"/>
  </svg>
  <div class="ttl">VVLGATA</div>
  <div class="sub">In nōmine Patris et Fīliī et Spīritūs Sānctī</div>
  <div class="rub">LATINA I · AD MAIOREM DEI GLORIAM</div>
  <button class="go" data-intro="go">INTROIBO AD ALTARE DEI<small>Astun Jumalan alttarin eteen</small></button>
 </div>
 <div class="door l"><span class="x"></span></div><div class="door r"><span class="x"></span></div>
 <div class="skip">NAPAUTA OHITTAAKSESI</div>`}
function chant(){const a=ac();if(!a||!S.snd)return;const t=a.currentTime;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.6);g.gain.linearRampToValueAtTime(.05,t+2.2);g.gain.linearRampToValueAtTime(0,t+3.4);const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.connect(g);g.connect(a.destination);[146.83,220,293.66,440].forEach((f,i)=>{const o=a.createOscillator();o.type=i%2?'triangle':'sawtooth';o.frequency.value=f;o.detune.value=(i-1.5)*5;o.connect(lp);o.start(t);o.stop(t+3.5)})}
function showIntro(){
 const d=document.createElement('div');d.id='intro';d.setAttribute('role','dialog');d.setAttribute('aria-label','Vulgata – johdanto');d.innerHTML=introHtml();document.body.appendChild(d);
 const enter=()=>{if(d.classList.contains('out'))return;ac();if(S.snd){chant();[392,523.25,659.25,783.99].forEach((f,i)=>setTimeout(()=>bell(f,.17,3.2),i*320));setTimeout(()=>bell(196,.22,4),0)}d.classList.add('out');setTimeout(()=>d.remove(),950)};
 d.addEventListener('click',e=>{if(e.target.closest('[data-intro="go"]'))return enter();if(!d.classList.contains('done'))d.classList.add('done')});
 document.addEventListener('keydown',function k(e){if(!document.getElementById('intro')){document.removeEventListener('keydown',k);return}if(e.key==='Enter'||e.key===' '||e.key==='Escape'){e.preventDefault();d.classList.contains('done')||e.key!=='Escape'?enter():d.classList.add('done')}});
 S.introDay=todayStr();save();
}
function wantIntro(){const m=S.intro||'day';if(m==='off')return false;if(m==='always')return true;return S.introDay!==todayStr()}

render();
if(wantIntro())showIntro();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
